# Standalone config, for previewing and checking these docs on their own.
# The combined site (with the webhook and oc-aibom) is built from
# gavinsan33/aibom-monorepo, which includes this file; its theme and
# markdown extensions apply there, so keep this one minimal.
site_name: AIBOM Console Plugin
repo_url: https://github.com/gavinsan33/aibom-console-plugin
edit_uri: edit/main/docs/

theme:
  name: material

exclude_docs: requirements.txt

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences

nav:
  - Overview: index.md
  - Guide:
      - Prerequisites: guide/prerequisites.md
      - Deployment: guide/deployment.md
      - Development: guide/development.md
